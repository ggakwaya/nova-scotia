name: Instantané météo

on:
  schedule:
    # 06:00 et 18:00 UTC = 03:00 et 15:00 heure de l'Atlantique.
    # Calé après les runs ECMWF 00z et 12z (~2 h de délai en open-data), pour
    # que les données soient fraîches quand on consulte le matin et le soir.
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Générer l'instantané
        # Secret optionnel : sans lui le script saute simplement le volet
        # Meteoblue. La clé reste dans l'env, jamais dans le fichier produit.
        env:
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
        run: node scripts/build-forecast-snapshot.mjs

      - name: Commiter si les données ont changé
        run: |
          if git diff --quiet -- forecast-snapshot.json; then
            echo "Aucun changement, rien à commiter."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast-snapshot.json
          git commit -m "chore(velo): instantané météo $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
